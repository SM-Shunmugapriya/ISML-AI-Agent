yaml
name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Regression Tests and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: isml_ai_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d isml_ai_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GEMINI_API_KEY: ci-dummy-key
      DEEPSEEK_API_KEY: ci-dummy-key
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: isml_ai_agent
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/isml_ai_agent
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate test configuration
        run: |
          python --version
          python -m pytest --version
          python -m pytest --help | grep -E -- '--cov|--cov-fail-under'

      - name: Initialize PostgreSQL and pgvector
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app.database.database import Base, engine
          import app.database.models

          with engine.begin() as connection:
              connection.execute(
                  text("CREATE EXTENSION IF NOT EXISTS vector")
              )

          Base.metadata.create_all(bind=engine)
          print("PostgreSQL tables and pgvector initialized.")
          PY

      - name: Run regression tests with coverage
        run: |
          python -m pytest -q \
            --cov=agents \
            --cov=services \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7
